//
// Using the ltsboot lts-dependencies BOM from Gradle as a native platform (no Boot Gradle plugin and no
// io.spring.dependency-management needed). Works on Gradle 6.8+ (tested 7.6.3).
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

plugins {
	id 'java'
}

repositories {
	// ltsboot's own verification points this at a throw-away file repository: -PltsRepo=file:///work/it/repo
	if (project.hasProperty('ltsRepo')) {
		maven { url = uri(project.property('ltsRepo')) }
	}
	mavenCentral()
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
	// 1. The platform: every version below comes from here (it imports Boot 2.7.18's own BOM last).
	implementation platform('io.github.ltsboot:lts-dependencies:2.7.18.1')

	// 2. Normal Boot starters, no versions.
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-activemq'
	implementation 'org.springframework.boot:spring-boot-starter-quartz'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	implementation 'org.springframework.kafka:spring-kafka'
}

// 3. Gradle ignores the <exclusions> that lts-dependencies declares for Maven. Declare the one that matters here:
//    mchange-commons-java is only pulled in by Quartz (ADR-004); Boot already drops c3p0.
configurations.configureEach {
	exclude group: 'com.mchange', module: 'mchange-commons-java'
}

// 4. lz4-java moved to the groupId at.yawk.lz4 (ADR-004). The new artifact declares the old capability org.lz4:lz4-java, so
//    Kafka's request for org.lz4:lz4-java and the platform's at.yawk.lz4 constraint collide: pick the maintained one.
configurations.configureEach {
	resolutionStrategy.capabilitiesResolution.withCapability('org.lz4:lz4-java') {
		def maintained = candidates.find { it.id instanceof ModuleComponentIdentifier && it.id.group == 'at.yawk.lz4' }
		if (maintained != null) {
			select(maintained)
			because 'org.lz4:lz4-java is unmaintained; at.yawk.lz4:lz4-java carries the security fixes'
		}
	}
}

// Opt-in alternatives (ADR-004): force a version from the platform, e.g. ActiveMQ 5.19.12 (needs Java 11) or Jackson 2.15.4:
// dependencies {
//     constraints {
//         implementation('org.apache.activemq:activemq-client:5.19.12') { because 'opt-in: fixes more CVEs, Java 11' }
//     }
// }

// Prints the jars of the runtime classpath (used by it/verify-gradle.sh).
tasks.register('lsRuntimeJars') {
	doLast {
		configurations.runtimeClasspath.files.each { println "jar: ${it.name}" }
	}
}
